<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-label="Agent Playbook three-panel comic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B10"/>
      <stop offset="100%" stop-color="#14101C"/>
    </linearGradient>
    <linearGradient id="panelGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1020"/>
      <stop offset="100%" stop-color="#101018"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF2D95" flood-opacity="0.35"/>
    </filter>
    <filter id="softCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#2DE2E6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="340" rx="18" fill="url(#bg)"/>
  <text x="28" y="36" fill="#FF2D95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">AGENT PLAYBOOK</text>
  <text x="892" y="36" text-anchor="end" fill="#2DE2E6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">discussion × LLM agents × literacy</text>

  <!-- Panel 1 -->
  <g transform="translate(24,52)" filter="url(#soft)">
    <rect width="280" height="260" rx="16" fill="url(#panelGlow)" stroke="#FF2D95" stroke-width="2"/>
    <rect x="14" y="14" width="72" height="22" rx="8" fill="#FF2D95"/>
    <text x="50" y="29" text-anchor="middle" fill="#0B0B10" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700">01 · LEARNER</text>
    <text x="140" y="78" text-anchor="middle" font-size="42">🧑‍🎓</text>
    <text x="140" y="120" text-anchor="middle" fill="#F4F0F7" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">議論が止まる</text>
    <text x="140" y="148" text-anchor="middle" fill="#9A93A5" font-family="ui-monospace, Menlo, monospace" font-size="12">「次、何を話せばいい？」</text>
    <rect x="36" y="168" width="208" height="64" rx="12" fill="#0B0B10" stroke="#FF2D95" stroke-opacity="0.45"/>
    <text x="140" y="192" text-anchor="middle" fill="#F4F0F7" font-family="ui-monospace, Menlo, monospace" font-size="11">Learner in a workshop</text>
    <text x="140" y="212" text-anchor="middle" fill="#FF2D95" font-family="ui-monospace, Menlo, monospace" font-size="11">needs a thinking partner</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M312 180 H332" stroke="#2DE2E6" stroke-width="3" stroke-linecap="round"/>
  <path d="M324 172 L336 180 L324 188" fill="none" stroke="#2DE2E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Panel 2 -->
  <g transform="translate(348,52)" filter="url(#softCyan)">
    <rect width="280" height="260" rx="16" fill="url(#panelGlow)" stroke="#2DE2E6" stroke-width="2"/>
    <rect x="14" y="14" width="88" height="22" rx="8" fill="#2DE2E6"/>
    <text x="58" y="29" text-anchor="middle" fill="#0B0B10" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700">02 · AGENT</text>
    <text x="140" y="78" text-anchor="middle" font-size="42">🤖</text>
    <text x="140" y="120" text-anchor="middle" fill="#F4F0F7" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">役割設計する</text>
    <text x="140" y="148" text-anchor="middle" fill="#9A93A5" font-family="ui-monospace, Menlo, monospace" font-size="12">問い返し · 要約 · 視点提示</text>
    <rect x="36" y="168" width="208" height="64" rx="12" fill="#0B0B10" stroke="#2DE2E6" stroke-opacity="0.55"/>
    <text x="140" y="192" text-anchor="middle" fill="#F4F0F7" font-family="ui-monospace, Menlo, monospace" font-size="11">LLM Agent + UX</text>
    <text x="140" y="212" text-anchor="middle" fill="#2DE2E6" font-family="ui-monospace, Menlo, monospace" font-size="11">scaffolds the dialogue</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M636 180 H656" stroke="#FF9F1C" stroke-width="3" stroke-linecap="round"/>
  <path d="M648 172 L660 180 L648 188" fill="none" stroke="#FF9F1C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Panel 3 -->
  <g transform="translate(672,52)">
    <rect width="224" height="260" rx="16" fill="url(#panelGlow)" stroke="#FF9F1C" stroke-width="2"/>
    <rect x="14" y="14" width="96" height="22" rx="8" fill="#FF9F1C"/>
    <text x="62" y="29" text-anchor="middle" fill="#0B0B10" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700">03 · OUTCOME</text>
    <text x="112" y="78" text-anchor="middle" font-size="42">🚀</text>
    <text x="112" y="120" text-anchor="middle" fill="#F4F0F7" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">学びが深まる</text>
    <text x="112" y="148" text-anchor="middle" fill="#9A93A5" font-family="ui-monospace, Menlo, monospace" font-size="11">AI literacy ↑</text>
    <rect x="24" y="168" width="176" height="64" rx="12" fill="#0B0B10" stroke="#FF9F1C" stroke-opacity="0.55"/>
    <text x="112" y="192" text-anchor="middle" fill="#F4F0F7" font-family="ui-monospace, Menlo, monospace" font-size="11">Human × AI</text>
    <text x="112" y="212" text-anchor="middle" fill="#FF9F1C" font-family="ui-monospace, Menlo, monospace" font-size="11">coexistence skills</text>
  </g>
</svg>
