name: Profile Metrics & Visuals

on:
  schedule:
    - cron: "0 15 * * *" # 毎日 0:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-metrics.yml"
      - ".github/scripts/**"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Language spectrum (all langs, private + org)
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUT_DIR: output
        run: python3 .github/scripts/generate-languages.py

      - name: Sync skillicons line in README
        run: |
          URL=$(tr -d '\n' < output/skillicons.url || true)
          if [ -n "$URL" ]; then
            python3 - <<'PY'
          from pathlib import Path
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          url = Path("output/skillicons.url").read_text(encoding="utf-8").strip()
          start = "<!-- SKILLICONS:START -->"
          end = "<!-- SKILLICONS:END -->"
          block = f'{start}\n<p align="center">\n  <img src="{url}" alt="Skill icons" />\n</p>\n{end}'
          if start in text and end in text:
              before, rest = text.split(start, 1)
              _, after = rest.split(end, 1)
              text = before + block + after
          else:
              raise SystemExit("README markers missing")
          readme.write_text(text, encoding="utf-8")
          print("skillicons synced")
          PY
          fi

      - name: 3D contribution grass
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Metrics — activity dashboard
        uses: lowlighter/metrics@latest
        with:
          filename: output/metrics.dashboard.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          user: ${{ github.repository_owner }}
          config_timezone: Asia/Tokyo
          base: header, activity, repositories
          output_action: none

      - name: Metrics — languages detail (top + %)
        uses: lowlighter/metrics@latest
        with:
          filename: output/metrics.languages.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          user: ${{ github.repository_owner }}
          config_timezone: Asia/Tokyo
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: yes
          plugin_languages_colors: >-
            0:#FF2D95, 1:#2DE2E6, 2:#FF9F1C, 3:#A855F7, 4:#22C55E,
            5:#38BDF8, 6:#F472B6, 7:#EAB308
          output_action: none

      - name: Metrics — achievements
        uses: lowlighter/metrics@latest
        with:
          filename: output/metrics.achievements.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          user: ${{ github.repository_owner }}
          config_timezone: Asia/Tokyo
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          output_action: none

      - name: Metrics — isocalendar
        uses: lowlighter/metrics@latest
        with:
          filename: output/metrics.isocalendar.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          user: ${{ github.repository_owner }}
          config_timezone: Asia/Tokyo
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: none

      - name: Collect metrics renders
        run: |
          mkdir -p output
          if [ -d /metrics_renders ]; then
            sudo cp -a /metrics_renders/. ./
          fi
          ls -la output profile-3d-contrib 2>/dev/null || true

      - name: Commit generated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add output profile-3d-contrib README.md || true
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh profile metrics & language spectrum"
            git push
          fi
