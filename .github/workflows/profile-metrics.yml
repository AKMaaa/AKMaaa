name: Profile Metrics & Visuals

on:
  schedule:
    - cron: "0 15 * * *" # 毎日 0:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-metrics.yml"
      - ".github/scripts/**"

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Language spectrum (all langs, private + org)
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUT_DIR: output
        run: python3 .github/scripts/generate-languages.py

      - name: Sync skillicons line in README
        run: |
          URL=$(tr -d '\n' < output/skillicons.url || true)
          if [ -n "$URL" ]; then
            python3 - <<'PY'
          from pathlib import Path
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          url = Path("output/skillicons.url").read_text(encoding="utf-8").strip()
          start = "<!-- SKILLICONS:START -->"
          end = "<!-- SKILLICONS:END -->"
          block = f'{start}\n<p align="center">\n  <img src="{url}" alt="Skill icons" />\n</p>\n{end}'
          if start in text and end in text:
              before, rest = text.split(start, 1)
              _, after = rest.split(end, 1)
              text = before + block + after
          else:
              raise SystemExit("README markers missing")
          readme.write_text(text, encoding="utf-8")
          print("skillicons synced")
          PY
          fi

      - name: 3D contribution grass
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: GitHub trophies (self-hosted generate)
        uses: soulteary/github-profile-trophy-action@v1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: output/trophy.svg
          options: >-
            username=${{ github.repository_owner }}&theme=radical&column=7&margin-w=8&margin-h=4&no-frame=true

      - name: Commit generated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add output profile-3d-contrib README.md || true
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh 3d grass, trophies, language & domain spectrum"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push conflict, retry $i"
            sleep $((i * 5))
            git rebase --abort 2>/dev/null || true
            git fetch origin main
          done
          exit 1
