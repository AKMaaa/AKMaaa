name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 古い「Deploy from a branch / Jekyll」が併走して赤くなるのを止める
  setup-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          current=$(gh api "repos/${{ github.repository }}/pages" 2>/dev/null)
          echo "$current" | head -c 500; echo
          if [ -z "$current" ]; then
            gh api --method POST "repos/${{ github.repository }}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=workflow
          else
            gh api --method PUT "repos/${{ github.repository }}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=workflow
          fi
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not switch Pages to Actions automatically."
            echo "Do this once: Settings → Pages → Source → GitHub Actions"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/pages" --jq '{build_type,html_url,status}'

  build:
    needs: setup-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CONTACT_API_URL: ${{ secrets.PUBLIC_CONTACT_API_URL }}
        # GitHub → Settings → Secrets and variables → Actions に
        # MICROCMS_* / PUBLIC_TURNSTILE_SITE_KEY / PUBLIC_CONTACT_API_URL
        # Turnstile の Secret Key は Worker の Encrypted Secret のみ

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
